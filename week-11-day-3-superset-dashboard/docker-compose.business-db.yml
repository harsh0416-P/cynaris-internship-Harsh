services:
  business-db:
    image: postgres:16
    container_name: cynaris_business_db
    environment:
      POSTGRES_DB: business_analytics
      POSTGRES_USER: business_user
      POSTGRES_PASSWORD: business_local_2026
    ports:
      - "5433:5432"
    volumes:
      - business_analytics_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U business_user -d business_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  business_analytics_data: